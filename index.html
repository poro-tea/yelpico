<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Intro Aesthetic ✦</title>
    <style>
        /* Variables de Paletas: Claro (Kawaii) y Oscuro (Gótico) */
        :root {
            --bg-body: #ffeef2;
            --bg-card: #ffffff;
            --border: #ffccd5;
            --text-title: #ff7597;
            --text-main: #6c5b7b;
            --textarea-bg: #fff5f7;
            --btn-hover: #ffe3e8;
            --icon-color: #ff7597;
            --toast-bg: #ffccd5;
            --toast-text: #ff477e;
            --btn-toggle-bg: #ffccd5;
            --btn-toggle-text: #ff7597;
        }

        [data-theme="dark"] {
            --bg-body: #121214;
            --bg-card: #1a1a1e;
            --border: #3a1a3a;
            --text-title: #9d4edf;
            --text-main: #c1b3cc;
            --textarea-bg: #141416;
            --btn-hover: #2d163d;
            --icon-color: #9d4edf;
            --toast-bg: #3a1a3a;
            --toast-text: #e0aaff;
            --btn-toggle-bg: #3a1a3a;
            --btn-toggle-text: #9d4edf;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        /* Botón de alternar Modo */
        .btn-theme {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--btn-toggle-bg);
            color: var(--btn-toggle-text);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        /* Contenedor adaptativo */
        .contenedor {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            width: 90%;
            max-width: 440px;
            transition: all 0.3s ease;
        }

        h2 {
            margin-top: 0;
            color: var(--text-title);
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Grupo relativo para el Textarea */
        .input-grupo {
            position: relative;
            display: flex;

</body>
</html>
